name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate debug keystore for release signing
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Build all APKs
        env:
          IS_CI: "true"
        run: ./gradlew assembleDebug assembleDev assembleRelease --no-configuration-cache

      - name: Rename APKs with version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/rift-companion-${VERSION}.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/rift-companion-${VERSION}-debug.apk
          cp app/build/outputs/apk/dev/app-dev.apk app/build/outputs/apk/dev/rift-companion-${VERSION}-dev.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rift-companion-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rift-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: rift-companion-dev
          path: app/build/outputs/apk/dev/app-dev.apk
          retention-days: 30

      - name: Create GitHub release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/rift-companion-${{ steps.version.outputs.VERSION }}.apk
            app/build/outputs/apk/debug/rift-companion-${{ steps.version.outputs.VERSION }}-debug.apk
            app/build/outputs/apk/dev/rift-companion-${{ steps.version.outputs.VERSION }}-dev.apk
          name: RiftCompanion ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
